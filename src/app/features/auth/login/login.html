<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Pet Mais Perto MT</h1>
      <p>Faça login para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="login">Usuário</label>
        <input 
          type="text" 
          id="username" 
          formControlName="username"
          class="form-control"
          [class.error]="username?.invalid && username?.touched"
          placeholder="Digite seu usuário"
        />
        <div class="error-message" *ngIf="username?.invalid && username?.touched">
          <span *ngIf="username?.errors?.['required']">O usuário é obrigatório</span>
          <span *ngIf="username?.errors?.['minlength']">O usuário deve ter no mínimo 3 caracteres</span>
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="password-input">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password"
            class="form-control"
            [class.error]="password?.invalid && password?.touched"
            placeholder="Digite sua senha"
          />
          <button 
            type="button" 
            class="toggle-password"
            (click)="togglePasswordVisibility()"
          >
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">A senha é obrigatória</span>
          <span *ngIf="password?.errors?.['minlength']">A senha deve ter no mínimo 6 caracteres</span>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn-login"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading">Entrando...</span>
      </button>
    </form>

    <div class="login-footer">
      <a routerLink="/auth/register">Criar uma conta</a>
    </div>
  </div>
</div>
